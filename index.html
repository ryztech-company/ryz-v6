<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RYZ Musical V6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --module-width: 1200px;
            --led-bg: #000;
            --led-text: #fff;
            --metallic-light: #f3f4f6;
            --metallic-mid: #9ca3af;
            --metallic-dark: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Impact, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html {
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background-color: #000;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
        }

        .module {
            --u: 1cqw;
            --knob-size: min(calc(11.5 * var(--u)), 10cqw);
            width: min(100%, var(--module-width), calc((100vh - 40px) * 16 / 9));
            width: min(100%, var(--module-width), calc((100dvh - 40px) * 16 / 9));
            aspect-ratio: 16 / 9;
            container-type: inline-size;
            background-color: #1a0600;
            border: 12px solid #000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.9),
                inset 0 0 20px rgba(255, 255, 255, 0.2),
                inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        @media (orientation: landscape) {
            body {
                padding: 0;
                min-height: 0;
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
            }

            .module {
                --u: min(1cqw, calc(1cqh * 16 / 9));
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                max-width: none;
                aspect-ratio: auto;
                container-type: size;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }
        }

        .bg-stage {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            background-color: #0a0a0a;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-image: url("https://raw.githubusercontent.com/pi-pop/bg/main/bg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 700ms ease;
            will-change: opacity;
        }

        .bg-layer.top {
            z-index: 2;
        }

        .bg-layer.show {
            opacity: 1;
        }

        .bg-vignette {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(0, 0, 0, 0.4) 100%);
        }

        .led-screen {
            position: absolute;
            top: 0.3%;
            left: 50%;
            transform: translateX(-50%);
            width: calc(39.1 * var(--u));
            aspect-ratio: 282 / 243;
            container-type: inline-size;
            --p: calc(100cqw / 282);
            background: #000;
            border-radius: calc(0.5 * var(--u));
            z-index: 29;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.7);
        }

        .led-screen, .led-screen * {
            font-family: 'Roboto Mono', ui-monospace, Menlo, Consolas, 'Courier New', monospace;
        }

        .lcd-frame, .led-track, .led-grid, .lcd-sep, .lcd-btn, .lcd-card {
            position: absolute;
            box-sizing: border-box;
            border: calc(2 * var(--p)) solid #f3f3f3;
        }

        .lcd-frame {
            left: calc(8.5 * var(--p)); top: calc(6 * var(--p));
            width: calc(265 * var(--p)); height: calc(231 * var(--p));
            border-radius: calc(22 * var(--p));
        }

        .led-track {
            left: calc(14.5 * var(--p)); top: calc(12 * var(--p));
            width: calc(253 * var(--p)); height: calc(53 * var(--p));
            border-radius: calc(26.5 * var(--p));
            background: #000;
            cursor: pointer;
            text-align: center;
            font-size: calc(29 * var(--p));
            font-weight: 600;
            line-height: calc(49 * var(--p));
            color: #eaf53a;
            padding: 0 calc(13 * var(--p)) 0 calc(3 * var(--p));
            white-space: nowrap;
            overflow: hidden;
        }

        .led-title {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            will-change: transform;
        }

        .led-title.moving {
            display: inline-block;
            overflow: visible;
            text-overflow: clip;
        }

        .led-grid {
            left: calc(14.5 * var(--p)); top: calc(69 * var(--p));
            width: calc(253 * var(--p)); height: calc(32.5 * var(--p));
            border-radius: calc(16.25 * var(--p));
            background: #000;
            overflow: hidden;
        }

        .lcd-ind {
            position: absolute;
            left: calc(16 * var(--p)); top: 50%;
            width: calc(15 * var(--p)); height: calc(15 * var(--p));
            margin-top: calc(-7.5 * var(--p));
            background: #ee4a27;
        }

        .lcd-ind.playing {
            background: #2fe05a;
            clip-path: polygon(0 0, 100% 50%, 0 100%);
        }

        .lcd-time {
            position: absolute;
            left: calc(38 * var(--p)); top: 0;
            font-size: calc(29 * var(--p));
            font-weight: 600;
            line-height: calc(28.5 * var(--p));
            color: #fff;
            white-space: nowrap;
        }

        .led-bars {
            position: absolute;
            left: calc(146 * var(--p)); right: calc(16 * var(--p)); bottom: calc(2 * var(--p));
            height: calc(22 * var(--p));
            display: flex;
            align-items: flex-end;
            gap: calc(0.3 * var(--p));
        }

        .led-bar {
            flex: 1;
            height: 100%;
            background: #fff;
            transform-origin: bottom;
            transform: scaleY(0.07);
            will-change: transform;
        }

        .lcd-sep {
            left: calc(14.5 * var(--p)); top: calc(105.5 * var(--p));
            width: calc(253 * var(--p)); height: calc(11.5 * var(--p));
            border-radius: calc(5.75 * var(--p));
            overflow: hidden;
        }

        .lcd-prog {
            height: 100%;
            width: 0;
            background: #ee2a2a;
        }

        .lcd-btn {
            top: calc(121 * var(--p));
            height: calc(34 * var(--p));
            border-radius: calc(17 * var(--p));
            text-align: center;
            font-size: calc(20 * var(--p));
            font-weight: 700;
            line-height: calc(30 * var(--p));
            color: #fff;
            white-space: nowrap;
        }

        .lcd-btn.bt { left: calc(14.5 * var(--p)); width: calc(124.5 * var(--p)); background: #1a9fe6; }
        .lcd-btn.stop { left: calc(143 * var(--p)); width: calc(124.5 * var(--p)); background: #f04b25; }
        .lcd-btn.stop.playing { background: #1fbf55; }

        .lcd-card {
            height: calc(34 * var(--p));
            border-radius: calc(17 * var(--p));
            overflow: hidden;
            background: linear-gradient(to bottom, #19a1e9 0, #19a1e9 42%, #0a4d89 47%, #041a33 54%, #000 62%, #000 100%);
        }

        .lcd-card.r1 { top: calc(159 * var(--p)); }
        .lcd-card.r2 { top: calc(197 * var(--p)); }
        .lcd-card.c1 { left: calc(14.5 * var(--p)); width: calc(124.5 * var(--p)); }
        .lcd-card.c2 { left: calc(143 * var(--p)); width: calc(124.5 * var(--p)); }

        .lcd-lbl {
            position: absolute;
            top: calc(1 * var(--p)); left: 0; right: 0;
            text-align: center;
            font-size: calc(8.5 * var(--p));
            font-weight: 600;
            line-height: calc(10 * var(--p));
            color: #fff;
        }

        .lcd-val {
            position: absolute;
            top: calc(9.5 * var(--p)); left: 0; right: 0;
            text-align: center;
            font-size: calc(18 * var(--p));
            font-weight: 700;
            line-height: calc(21 * var(--p));
            color: #fff;
            white-space: nowrap;
        }

        .lcd-card.r0 { top: calc(121 * var(--p)); }

        .lcd-plist { display: none; }
        .led-screen.mode-plist .lcd-plist { display: block; }
        .led-screen.mode-plist .lcd-n { display: none; }

        .lcd-prows {
            position: absolute;
            left: calc(14.5 * var(--p)); top: calc(69 * var(--p));
            width: calc(253 * var(--p)); height: calc(136.5 * var(--p));
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }

        .lcd-prow {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: calc(19.5 * var(--p));
            line-height: calc(19.5 * var(--p));
            padding: 0 calc(8 * var(--p));
            border-radius: calc(3 * var(--p));
            font-size: calc(14 * var(--p));
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            will-change: transform;
        }

        .lcd-pthumb {
            position: absolute;
            right: calc(1.5 * var(--p));
            top: 0;
            width: calc(3 * var(--p));
            border-radius: calc(1.5 * var(--p));
            background: rgba(255, 255, 255, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
            z-index: 2;
        }

        .lcd-pthumb.show {
            opacity: 1;
        }

        .lcd-prow.sel { background: #1a9fe6; }
        .lcd-prow .arr { color: #eaf53a; font-weight: 700; }

        .lcd-pnum {
            position: absolute;
            left: calc(14.5 * var(--p)); top: calc(210 * var(--p));
            width: calc(253 * var(--p)); height: calc(21 * var(--p));
            box-sizing: border-box;
            border-radius: calc(10.5 * var(--p));
            background: #eaf53a;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 calc(12 * var(--p));
            font-size: calc(14 * var(--p));
            font-weight: 700;
        }

        .lcd-pempty {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(14 * var(--p));
            font-weight: 600;
            color: rgba(210, 210, 215, 0.55);
            white-space: nowrap;
            pointer-events: none;
        }

        .lcd-val.long { font-size: calc(15 * var(--p)); }
        .lcd-val.small { font-size: calc(10 * var(--p)); font-weight: 500; }
        .lcd-val.on { color: #22f024; }
        .lcd-val.off { color: #ff2d1c; }

        .lcd-confirm {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.62);
        }

        .lcd-confirm.open {
            display: flex;
            animation: dlg-fade 180ms ease-out;
        }

        .lcd-dialog {
            overflow: hidden;
            width: calc(232 * var(--p));
            padding: calc(14 * var(--p)) calc(12 * var(--p)) calc(12 * var(--p));
            border: calc(2 * var(--p)) solid #f3f3f3;
            border-radius: calc(20 * var(--p));
            background: linear-gradient(to bottom, #15151d 0%, #05050a 100%);
            box-shadow:
                0 calc(8 * var(--p)) calc(22 * var(--p)) rgba(0, 0, 0, 0.9),
                0 0 calc(14 * var(--p)) rgba(234, 245, 58, 0.22);
            text-align: center;
            animation: dlg-pop 300ms var(--spring, cubic-bezier(0.34, 1.56, 0.64, 1));
        }

        .lcd-dlg-msg {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 4;
            overflow: hidden;
            color: #eaf53a;
            font-size: calc(15 * var(--p));
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
        }

        .lcd-dlg-row {
            position: relative;
            display: flex;
            justify-content: space-between;
            gap: calc(10 * var(--p));
            margin: calc(12 * var(--p)) calc(2 * var(--p)) 0;
        }

        .lcd-dlg-slider {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: calc((100% - 10 * var(--p)) / 2);
            box-sizing: border-box;
            border: calc(2 * var(--p)) solid #ff2d1c;
            border-radius: calc(15 * var(--p));
            background: rgba(255, 45, 28, 0.18);
            box-shadow: 0 0 calc(12 * var(--p)) rgba(255, 45, 28, 0.55), inset 0 0 calc(8 * var(--p)) rgba(255, 45, 28, 0.35);
            transform: translate3d(0, 0, 0);
            transition: transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            will-change: transform;
        }

        .lcd-dlg-slider.right {
            transform: translate3d(calc(100% + 10 * var(--p)), 0, 0);
        }

        .lcd-dlg-slider.move {
            animation: dlg-stretch 480ms ease-out;
        }

        .lcd-dlg-btn {
            position: relative;
            z-index: 1;
            flex: 1;
            height: calc(30 * var(--p));
            border: calc(2 * var(--p)) solid transparent;
            border-radius: calc(15 * var(--p));
            color: #eaf53a;
            font-size: calc(17 * var(--p));
            font-weight: 700;
            line-height: calc(26 * var(--p));
            text-align: center;
            cursor: pointer;
            transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
        }

        .lcd-dlg-btn.sel {
            color: #ff2d1c;
            animation: dlg-btn-pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes dlg-stretch {
            0% { scale: 1 1; }
            40% { scale: 1.06 0.9; }
            100% { scale: 1 1; }
        }

        @keyframes dlg-btn-pop {
            0% { scale: 0.86; }
            55% { scale: 1.1; }
            100% { scale: 1; }
        }

        @keyframes dlg-fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes dlg-pop {
            from { opacity: 0; transform: translateY(calc(8 * var(--p))) scale(0.86); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .central-logo {
            position: absolute;
            top: 56%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            pointer-events: none;
        }

        .logo-frame {
            position: relative;
            display: block;
        }

        .logo-frame:not(.ready) .logo-glow {
            visibility: hidden;
        }

        .logo-glow {
            position: absolute;
            inset: -30% -14%;
            z-index: 1;
            background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 45, 65, 0.85) 0%, rgba(255, 25, 45, 0.5) 38%, rgba(255, 0, 30, 0) 72%);
            filter: blur(calc(1.2 * var(--u)));
            animation: neon-flicker 6s linear infinite;
        }

        .logo-glow::after {
            content: '';
            position: absolute;
            inset: 18% 10%;
            background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 130, 140, 0.55) 0%, rgba(255, 40, 60, 0) 65%);
        }

        .logo-img {
            position: relative;
            z-index: 2;
            display: block;
            width: min(calc(69 * var(--u)), 52cqw);
            height: auto;
            object-fit: contain;
            filter:
                drop-shadow(0 0 calc(0.4 * var(--u)) rgba(255, 70, 90, 0.95))
                drop-shadow(0 0 calc(1.2 * var(--u)) rgba(255, 30, 50, 0.85))
                drop-shadow(0 0 calc(3 * var(--u)) rgba(255, 0, 30, 0.65));
        }

        @keyframes neon-flicker {
            0%, 44%, 56%, 100% { opacity: 1; }
            46% { opacity: 0.55; }
            48% { opacity: 1; }
            50% { opacity: 0.7; }
            52% { opacity: 1; }
            54% { opacity: 0.85; }
        }

        .knob-wrapper {
            position: absolute;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .knob {
            position: relative;
            width: var(--knob-size);
            height: var(--knob-size);
            border-radius: 50%;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .knob > span {
            position: absolute;
            display: block;
            border-radius: 50%;
            pointer-events: none;
        }

        .knob-shadow {
            inset: 10% 6% -8% 6%;
            background: rgba(0, 0, 0, 0.75);
            filter: blur(calc(0.8 * var(--u)));
            opacity: 0.9;
            transform: translateY(calc(0.9 * var(--u))) scale(1);
            transition: transform 750ms var(--spring, cubic-bezier(0.34, 1.56, 0.64, 1)), opacity 500ms ease;
            will-change: transform;
        }

        .knob-glow {
            inset: -8%;
            opacity: 0;
            box-shadow: 0 0 calc(2.2 * var(--u)) calc(0.6 * var(--u)) var(--glow, #19ff5a);
            transition: opacity 500ms ease;
        }

        .knob-cap {
            inset: 0;
            background: radial-gradient(circle at 35% 35%, var(--metallic-light) 0%, var(--metallic-mid) 30%, var(--metallic-dark) 80%);
            border: 3px solid #111;
            box-shadow:
                inset 0 4px 5px rgba(255, 255, 255, 0.6),
                inset 0 -4px 5px rgba(0, 0, 0, 0.6);
            transform: translateY(0) scale(1);
            transition:
                transform 750ms var(--spring, cubic-bezier(0.34, 1.56, 0.64, 1)),
                border-color 400ms ease,
                filter 500ms ease;
            will-change: transform;
        }

        .knob-cap::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            right: 15%;
            bottom: 15%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #9ca3af, #d1d5db, #6b7280, #f3f4f6, #9ca3af);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            transform: rotate(0deg);
            transition: transform 900ms var(--spring, cubic-bezier(0.34, 1.56, 0.64, 1));
        }

        .knob-cap::after {
            content: '';
            position: absolute;
            top: 6%;
            left: 14%;
            width: 55%;
            height: 30%;
            border-radius: 50%;
            background: linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
            transform: rotate(-18deg);
            opacity: 0.85;
            transition: opacity 500ms ease;
        }

        .knob-ring {
            inset: 0;
            border: 3px solid rgba(255, 214, 120, 0.95);
            opacity: 0;
        }

        .knob.pressing .knob-cap {
            transform: translateY(calc(0.5 * var(--u))) scale(0.92);
            transition:
                transform 90ms cubic-bezier(0.22, 0.9, 0.3, 1),
                border-color 400ms ease,
                filter 500ms ease;
        }

        .knob.pressing .knob-cap::before {
            transform: rotate(24deg);
            transition: transform 120ms cubic-bezier(0.22, 0.9, 0.3, 1);
        }

        .knob.pressing .knob-cap::after {
            opacity: 0.35;
            transition: opacity 90ms ease;
        }

        .knob.pressing .knob-shadow {
            transform: translateY(calc(0.3 * var(--u))) scale(0.84);
            opacity: 0.55;
            transition: transform 90ms cubic-bezier(0.22, 0.9, 0.3, 1), opacity 90ms ease;
        }

        .knob.disabled {
            cursor: not-allowed;
        }

        .knob.disabled .knob-cap {
            filter: brightness(0.6);
        }

        .knob.active-power .knob-glow {
            opacity: 1;
            --glow: #ff2a2a;
        }

        .knob.active-power .knob-cap {
            border-color: #ff2a2a;
        }

        .knob.active-play .knob-glow {
            opacity: 1;
            --glow: #19ff5a;
        }

        .knob.active-play .knob-cap {
            border-color: #19ff5a;
        }

        .knob-label {
            color: #fff;
            font-size: clamp(9px, calc(1.5 * var(--u)), 24px);
            text-shadow: 2px 2px 4px rgba(20, 4, 0, 0.9);
            text-transform: uppercase;
            font-style: italic;
            transition: transform 700ms var(--spring, cubic-bezier(0.34, 1.56, 0.64, 1)), opacity 400ms ease;
        }

        .knob-wrapper:has(.knob.pressing) .knob-label {
            transform: translateY(calc(0.3 * var(--u)));
            opacity: 0.8;
            transition: transform 90ms ease-out, opacity 90ms ease-out;
        }

        #kw-prev { top: 14%; left: 7%; }
        #kw-next { top: 14%; left: 22%; }
        #kw-remove { top: 64.5%; left: 7%; }
        #kw-upload { top: 64.5%; left: 22%; }
        #kw-power { top: 64.5%; left: 50%; transform: translateX(-50%); }
        #kw-doremi { top: 64.5%; left: calc(78% - var(--knob-size)); }
        #kw-play { top: 64.5%; right: 7%; }

        .tempo-group {
            position: absolute;
            top: 14%;
            right: 7%;
            width: calc(15% + var(--knob-size));
            display: grid;
            grid-template-columns: var(--knob-size) minmax(0, 1fr) var(--knob-size);
            z-index: 30;
        }

        .tempo-group .knob-wrapper {
            position: static;
        }

        .tempo-center {

    <script>
        let isPowerOn = false;
        let isPlaying = false;
        let tempo = 120;
        let playlist = [];
        let currentFileIndex = 0;
        let backgroundId = null;
        let tempSongId = 0;
        let synth = null;
        let playingSong = null;
        let queued = false;
        let tempoFor = null;
        let scrollBusy = false;

        const defaultBackground = "https://raw.githubusercontent.com/pi-pop/bg/main/bg.jpg";

        function buildSpringEasing() {
            const steps = 64;
            const zeta = 0.42;
            const w0 = 24;
            const wd = w0 * Math.sqrt(1 - zeta * zeta);
            const points = [];
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const value = i === steps ? 1 : 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + (zeta * w0 / wd) * Math.sin(wd * t));
                points.push(value.toFixed(4));
            }
            return `linear(${points.join(', ')})`;
        }

        if (window.CSS && CSS.supports('animation-timing-function', 'linear(0, 1)')) {
            document.documentElement.style.setProperty('--spring', buildSpringEasing());
        }

        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const noteMap = [];
        for (let octave = 1; octave <= 5; octave++) {
            noteNames.forEach(name => noteMap.push(name + octave));
        }
        noteMap.push("C6");
        const allNotes = [];
        for (let octave = 0; octave <= 9; octave++) {
            noteNames.forEach(name => allNotes.push(name + octave));
        }
        allNotes.push("C10");
        const noteIndex = {};
        noteMap.forEach((note, i) => { noteIndex[note] = i; });
        const lowestMidi = 24;
        const highestMidi = lowestMidi + noteMap.length - 1;

        function keyId(note) {
            return 'key-' + note.replace('#', 's');
        }

        const keyGroups = new Map();

        function registerKey(note, el) {
            let group = keyGroups.get(note);
            if (!group) {
                group = [];
                keyGroups.set(note, group);
            }
            group.push(el);
        }

        function setKeyPressed(note, on) {
            const group = keyGroups.get(note);
            if (group) group.forEach(el => el.classList.toggle('pressed', on));
        }

        function mapMidiToNote(midi) {
            let value = midi;
            while (value < lowestMidi) value += 12;
            while (value > highestMidi) value -= 12;
            return noteMap[value - lowestMidi];
        }

        function buildKeyboard() {
            const container = document.getElementById('keyboard-container');
            for (let i = allNotes.length - 1; i >= 0; i--) {
                const note = allNotes[i];

                el.id = keyId(note);
                el.dataset.note = note;

                if (note.includes('#')) {
                    el.className = 'black-key';

                    el.className = note.startsWith('C') ? 'white-key c-note' : 'white-key';
                    const label = document.createElement('span');
                    label.className = 'key-label';
                    label.textContent = note;
                    el.appendChild(label);
                }

                registerKey(note, el);
                container.appendChild(el);
            }
        }

        function buildHzKeyboard() {
            const container = document.getElementById('hz-keys');
            const whiteTotal = allNotes.filter(note => !note.includes('#')).length;
            const blackWidth = (100 / whiteTotal) * 0.6;
            let whiteCount = 0;
            allNotes.forEach(note => {
                const el = document.createElement('div');
                el.dataset.note = note;
                if (note.includes('#')) {
                    el.className = 'hk-black';
                    el.style.width = blackWidth + '%';
                    el.style.left = ((whiteCount / whiteTotal) * 100 - blackWidth / 2) + '%';
                } else {
                    el.className = 'hk-white';
                    const label = document.createElement('span');
                    label.className = 'hk-label';
                    label.textContent = note;
                    el.appendChild(label);
                    whiteCount++;
                }
                registerKey(note, el);
                container.appendChild(el);
            });

        function bindKnobPress() {
            const minimumPress = 110;
            document.querySelectorAll('.knob').forEach(knob => {
                let releaseTimer = null;
                let pressedAt = 0;

                const press = () => {
                    if (knob.classList.contains('disabled')) return;
                    clearTimeout(releaseTimer);
                    pressedAt = performance.now();
                    knob.classList.add('pressing');
                    fireRing(knob);
                };

                const release = () => {
                    if (!knob.classList.contains('pressing')) return;
                    const wait = Math.max(0, minimumPress - (performance.now() - pressedAt));
                    clearTimeout(releaseTimer);
                    releaseTimer = setTimeout(() => knob.classList.remove('pressing'), wait);
                };

                knob.addEventListener('pointerdown', press);
                knob.addEventListener('pointerup', release);
                knob.addEventListener('pointerleave', release);
                knob.addEventListener('pointercancel', release);
            });

        function detectWifi() {
            if (navigator.onLine === false) return false;
            const info = connectionInfo();
            if (info && typeof info.type === 'string') {
                if (info.type === 'wifi') return true;
                if (info.type === 'unknown') return true;
                return false;
            }
            return true;
        }

        function withTimeout(promise, ms) {
            return new Promise((resolve) => {
                const timer = setTimeout(() => resolve(null), ms);
                Promise.resolve(promise).then(
                    (value) => { clearTimeout(timer); resolve(value); },
                    () => { clearTimeout(timer); resolve(null); }
                );
            });
        }

        async function readBluetooth() {
            const info = connectionInfo();
            if (info && info.type === 'bluetooth') return true;
            const api = navigator.bluetooth;
            let availability = null;
            if (api) {
                if (typeof api.getAvailability === 'function') {
                    const value = await withTimeout(api.getAvailability(), 1500);
                    if (typeof value === 'boolean') availability = value;
                }
                if (typeof api.getDevices === 'function') {
                    const devices = await withTimeout(api.getDevices(), 1500);
                    if (Array.isArray(devices) && devices.some(device => device.gatt && device.gatt.connected)) return true;
                }
                if (availability !== null) return availability;
            }
            if (navigator.mediaDevices && typeof navigator.mediaDevices.enumerateDevices === 'function') {
                const list = await withTimeout(navigator.mediaDevices.enumerateDevices(), 1500);
                if (Array.isArray(list) && list.some(item => item.kind === 'audiooutput' && /bluetooth|airpods|buds|\bbt\b/i.test(item.label || ''))) return true;
            }
            return null;
        }

        let radioAgain = false;
        let btVerifyTimer = 0;

        function commitBluetooth(value) {
            if (typeof value !== 'boolean' || value === radio.bt) return;
            radio.bt = value;
            renderRadio();
        }

        async function probeRadio() {
            if (radioBusy) {
                radioAgain = true;
                return;
            }
            radioBusy = true;
            try {
                do {
                    radioAgain = false;
                    radio.wifi = detectWifi();
                    const reading = await readBluetooth();
                    if (reading !== null && reading !== radio.bt) {
                        clearTimeout(btVerifyTimer);
                        btVerifyTimer = setTimeout(async () => {
                            const again = await readBluetooth();
                            if (again === reading) commitBluetooth(again);
                        }, 350);
                    }
                    renderRadio();
                } while (radioAgain);
            } finally {
                radioBusy = false;
            }
        }

        function startRadioWatch() {
            probeRadio();
            const info = connectionInfo();
            if (info && info.addEventListener) info.addEventListener('change', probeRadio);
            window.addEventListener('online', probeRadio);
            window.addEventListener('offline', probeRadio);
            window.addEventListener('focus', probeRadio);
            window.addEventListener('pageshow', probeRadio);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) probeRadio(); });
            if (navigator.bluetooth && navigator.bluetooth.addEventListener) {
                navigator.bluetooth.addEventListener('availabilitychanged', (e) => {
                    clearTimeout(btVerifyTimer);
                    commitBluetooth(!!e.value);
                    probeRadio();
                });
            }
            if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
                navigator.mediaDevices.addEventListener('devicechange', probeRadio);
            }
            setInterval(() => { if (!document.hidden) probeRadio(); }, 1500);
        }

        function openDb() {
            if (dbPromise) return dbPromise;
            dbPromise = new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject(new Error('indexedDB unavailable'));
                    return;
                }
                const request = indexedDB.open('ryz-musical', 1);
                request.onupgradeneeded = () => {
                    const db = request.result;
                    db.createObjectStore('kv', { keyPath: 'key' });
                    ['songs', 'images', 'takes', 'history'].forEach(name => {
                        db.createObjectStore(name, { keyPath: 'id', autoIncrement: true });
                    });
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            return dbPromise;
        }

        function runStore(store, mode, action) {
            return openDb().then(db => new Promise((resolve, reject) => {
                const transaction = db.transaction(store, mode);
                const request = action(transaction.objectStore(store));
                transaction.oncomplete = () => resolve(request ? request.result : undefined);
                transaction.onerror = () => reject(transaction.error);
                transaction.onabort = () => reject(transaction.error);
            }));
        }

        const dbAdd = (store, value) => runStore(store, 'readwrite', s => s.add(value));
        const dbPut = (store, value) => runStore(store, 'readwrite', s => s.put(value));
        const dbGet = (store, key) => runStore(store, 'readonly', s => s.get(key));
        const dbAll = (store) => runStore(store, 'readonly', s => s.getAll());
        const dbKeys = (store) => runStore(store, 'readonly', s => s.getAllKeys());
        const dbDelete = (store, key) => runStore(store, 'readwrite', s => s.delete(key));
        const dbClear = (store) => runStore(store, 'readwrite', s => s.clear());

        let currentTitle = '';

        const marquee = { phase: 'idle', x: 0, t0: 0, last: 0, raf: 0, metrics: null };

        function marqueeApply() {
            titleEl.style.transform = marquee.x === 0 ? '' : `translateX(${marquee.x}px)`;
        }

        function marqueeMetrics() {
            const cs = getComputedStyle(lcdTrack);
            const padL = parseFloat(cs.paddingLeft);
            const padR = parseFloat(cs.paddingRight);
            const contentW = lcdTrack.clientWidth - padL - padR;
            const textW = titleEl.offsetWidth;
            const restLeft = Math.max(0, (contentW - textW) / 2);
            return {
                restLeft,
                hideX: -(restLeft + textW + padL + 4),
                inX: contentW + padR - restLeft + 2,
                speed: parseFloat(cs.fontSize) * 2.8
            };
        }

        function marqueeReset() {
            cancelAnimationFrame(marquee.raf);
            marquee.raf = 0;
            marquee.phase = 'idle';
            marquee.x = 0;
            titleEl.classList.remove('moving');
            marqueeApply();
        }

        function marqueeTick(ts) {
            const dt = Math.min(0.05, (ts - marquee.last) / 1000);
            marquee.last = ts;

            if (performance.now() < flashUntil) {
                marquee.x = 0;
                marquee.phase = 'wait';
                marquee.t0 = ts;
                titleEl.classList.remove('moving');
                marqueeApply();
                marquee.raf = requestAnimationFrame(marqueeTick);
                return;
            }

            const m = marquee.metrics;
            if (marquee.phase === 'wait') {
                if (ts - marquee.t0 >= 3000) {
                    titleEl.classList.add('moving');
                    marquee.metrics = marqueeMetrics();
                    marquee.phase = 'out';
                }
            } else if (marquee.phase === 'stophold') {
                if (ts - marquee.t0 >= 1000) {
                    marquee.phase = 'wait';
                    marquee.t0 = ts;
                }
            } else if (marquee.phase === 'out') {
                marquee.x -= m.speed * dt;
                if (marquee.x <= m.hideX) {
                    marquee.x = m.hideX;
                    marquee.phase = 'gap';
                    marquee.t0 = ts;
                }
            } else if (marquee.phase === 'gap') {
                if (ts - marquee.t0 >= (isPlaying ? 1000 : 2000)) {
                    marquee.x = m.inX;
                    marquee.phase = 'in';
                }
            } else if (marquee.phase === 'in') {
                marquee.x -= m.speed * dt;
                if (marquee.x <= 0) {
                    marquee.x = 0;
                    marquee.phase = 'wait';
                    marquee.t0 = ts;
                    titleEl.classList.remove('moving');
                }
            } else {
                return;
            }

            marqueeApply();
            marquee.raf = requestAnimationFrame(marqueeTick);
        }

        function marqueeStart() {
            cancelAnimationFrame(marquee.raf);
            if (!isPowerOn) {
                marqueeReset();
                return;
            }
            titleEl.classList.remove('moving');
            marquee.phase = 'wait';
            marquee.x = 0;
            marquee.t0 = performance.now();
            marquee.last = marquee.t0;
            marqueeApply();
            marquee.raf = requestAnimationFrame(marqueeTick);
        }

        function marqueeStop() {
            if (marquee.phase === 'idle') return;
            cancelAnimationFrame(marquee.raf);
            titleEl.classList.remove('moving');
            marquee.x = 0;
            marquee.phase = 'stophold';
            marquee.t0 = performance.now();
            marquee.last = marquee.t0;
            marqueeApply();
            marquee.raf = requestAnimationFrame(marqueeTick);
        }

        function setTitle(text) {

        function flashTrack(message, duration) {

        const BAR_COUNT = noteMap.length;
        const barEls = [];
        for (let i = 0; i < BAR_COUNT; i++) {
            const bar = document.createElement('div');
            bar.className = 'led-bar';
            bar.style.background = `hsl(${Math.round(i / (BAR_COUNT - 1) * 280)}, 95%, 55%)`;
            ledBars.appendChild(bar);
            barEls.push(bar);
        }
        const barLevels = new Float32Array(BAR_COUNT);
        const barShown = new Float32Array(BAR_COUNT);
        const barTarget = new Float32Array(BAR_COUNT);
        const barVel = new Float32Array(noteMap.length);
        const barAge = new Float32Array(noteMap.length);
        const barHolds = new Int16Array(noteMap.length);
        const timeline = { events: [], pointer: 0, endTick: 0, doneAt: 0, startTime: 0 };
        let barsActive = false;
        let barsRaf = 0;
        let barsLast = 0;
        let barsEnterTimer = null;

        function renderBars(force) {
            for (let i = 0; i < barEls.length; i++) {
                const level = barLevels[i];
                if (force || Math.abs(level - barShown[i]) > 0.002) {
                    barShown[i] = level;
                    barEls[i].style.transform = `scaleY(${Math.max(0.07, level).toFixed(3)})`;
                }
            }
        }

        function noteOn(index, velocity) {
            barHolds[index]++;
            barVel[index] = 0.4 + 0.6 * velocity;
            barAge[index] = 0;
            if (barHolds[index] === 1) setKeyPressed(noteMap[index], true);
        }

        function noteOff(index) {
            if (barHolds[index] === 0) return;
            barHolds[index]--;
            if (barHolds[index] === 0) setKeyPressed(noteMap[index], false);
        }

        function enterBars() {
            if (barsActive) return;
            barsActive = true;
            ledGrid.classList.add('show-bars');
            renderBars(true);
            ensureBarsLoop();
        }

        function exitBars() {
            barsActive = false;
            ledGrid.classList.remove('show-bars');
        }

        function finishSong() {
            stopMIDI();
        }

        function processTimeline() {
            if (!isPlaying) return;
            const raw = Tone.getContext().rawContext;
            const latency = Math.min(0.5, (raw.outputLatency || 0) + (raw.baseLatency || 0));
            const time = raw.currentTime - latency;
            if (time < timeline.startTime) return;
            const tick = Tone.Transport.getTicksAtTime(time);
            const events = timeline.events;
            while (timeline.pointer < events.length && events[timeline.pointer].tick <= tick) {
                const event = events[timeline.pointer];
                timeline.pointer++;
                if (event.on) noteOn(event.index, event.velocity);
                else noteOff(event.index);
            }
            if (timeline.pointer >= events.length && tick >= timeline.endTick) {
                if (!timeline.doneAt) timeline.doneAt = performance.now();
                else if (performance.now() - timeline.doneAt > 700) finishSong();
            }
        }

        function computeBarTargets() {
            for (let i = 0; i < BAR_COUNT; i++) {
                barTarget[i] = barHolds[i] > 0
                    ? barVel[i] * (0.55 + 0.45 * Math.exp(-barAge[i] * 2.2))
                    : 0;
            }
        }

        function songTempo(song) {
            let bpm = 120;
            try {
                const list = song.midi.header.tempos;
                if (list && list.length && Number.isFinite(list[0].bpm)) bpm = list[0].bpm;
            } catch (err) {
                bpm = 120;
            }
            return Math.min(300, Math.max(40, Math.round(bpm)));
        }

        function syncTempoToCursor() {
            const song = playlist[currentFileIndex];
            if (isPlaying || scrollBusy || !song || song === tempoFor) return;
            tempoFor = song;
            tempo = songTempo(song);
            try { Tone.Transport.bpm.value = tempo; } catch (err) {}
        }

        function noteToMidi(note) {
            const m = /^([A-G]#?)(\d+)$/.exec(note);
            if (!m) return lowestMidi;
            return 12 * (parseInt(m[2], 10) + 1) + noteNames.indexOf(m[1]);
        }

        function barIndexOf(note) {
            return noteIndex[mapMidiToNote(noteToMidi(note))];
        }

        function barNoteOn(index, velocity) {
            if (index === undefined) return;
            barHolds[index]++;
            barVel[index] = 0.4 + 0.6 * velocity;
            barAge[index] = 0;
            enterBars();
            ensureBarsLoop();
        }

        function barNoteOff(index) {
            if (index === undefined || barHolds[index] === 0) return;
            barHolds[index]--;
        }

        function barsTick(ts) {
            const dt = Math.min(0.05, Math.max(0.001, (ts - barsLast) / 1000));
            barsLast = ts;
            processTimeline();
            renderClock();

            for (let i = 0; i < barHolds.length; i++) {
                if (barHolds[i] > 0) barAge[i] += dt;
            }
            computeBarTargets();

            let peak = 0;
            for (let i = 0; i < BAR_COUNT; i++) {
                const target = barTarget[i];
                const rate = target > barLevels[i] ? 30 : 9;
                let level = barLevels[i] + (target - barLevels[i]) * (1 - Math.exp(-dt * rate));
                if (target === 0 && level < 0.004) level = 0;
                barLevels[i] = level;
                if (level > peak) peak = level;
            }

            if (barsActive) renderBars(false);

            if (!isPlaying && peak < 0.01) {
                barLevels.fill(0);
                if (barsActive) {
                    renderBars(true);
                    exitBars();
                }
                barsRaf = 0;
                return;
            }
            barsRaf = requestAnimationFrame(barsTick);
        }

        function ensureBarsLoop() {
            if (barsRaf) return;
            barsLast = performance.now();
            barsRaf = requestAnimationFrame(barsTick);
        }

        async function initSynth() {
            if (!synth) {
                const limiter = new Tone.Limiter(-2).toDestination();
                const volume = new Tone.Volume(-14).connect(limiter);
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "square" },
                    envelope: { attack: 0.005, decay: 0.08, sustain: 0.6, release: 0.12 }
                }).connect(volume);
                synth.maxPolyphony = 64;
            }
            await Tone.start();
        }

        function updateUI() {
            const flashing = performance.now() < flashUntil;

            if (!isPowerOn) {
                if (!flashing) setTitle("SYS: OFFLINE");
                lcdTempo.innerText = "---";
                lcdFileIdx.innerText = "0000 / 0000";
                lcdStatus.innerText = "STOP";
                lcdStatus.classList.remove('playing');
                lcdInd.classList.remove('playing');
                renderRadio();
                renderClock();
                sysControls.forEach(el => el.classList.add('disabled'));
                btnPower.classList.remove('active-power');
                btnPlay.classList.remove('active-play');
                clearTimeout(barsEnterTimer);
                exitBars();
                closeDoremi();
                closeConfirm();
                if (screenMode !== 'normal') setScreen('normal');
                return;
            }

            sysControls.forEach(el => el.classList.remove('disabled'));
            btnPower.classList.add('active-power');
            syncTempoToCursor();
            lcdTempo.innerText = `${tempo} BPM`;
            lcdStatus.innerText = isPlaying ? "PLAY" : "STOP";
            lcdStatus.classList.toggle('playing', isPlaying);
            lcdInd.classList.toggle('playing', isPlaying);
            renderRadio();
            renderClock();

            if (currentFileIndex >= playlist.length) currentFileIndex = 0;

            if (playlist.length > 0) {
                let shown = currentFileIndex;
                if (isPlaying && queued && playingSong) {
                    const at = playlist.indexOf(playingSong);
                    if (at !== -1) shown = at;
                }
                if (!flashing) setTitle(playlist[shown].name.replace(/\.midi?$/i, ''));
                lcdFileIdx.innerText = `${pad4(shown + 1)} / ${pad4(playlist.length)}`;
            } else {
                if (!flashing) setTitle("SYS: NO MIDI LOADED");
                lcdFileIdx.innerText = "0000 / 0000";
            }

            if (screenMode === 'plist') renderPlaylist();
            dmDrawRoll();
        }

        btnPower.addEventListener('click', async () => {
            if (!isPowerOn) {
                setTitle("BOOTING AUDIO...");
                try {
                    await initSynth();
                    isPowerOn = true;
                    Tone.Transport.bpm.value = tempo;
                    updateUI();
                    marqueeStart();
                    logHistory('power', 'Power ON');
                } catch (e) {
                    setTitle("AUDIO INIT ERROR");
                }
            } else {
                finishTake();
                stopMIDI();
                isPowerOn = false;
                updateUI();
                logHistory('power', 'Power OFF');
            }
        });

        function triggerVisualPress(note) {
            setKeyPressed(note, true);
        }

        function triggerVisualRelease(note) {
            setKeyPressed(note, false);
        }

        let take = null;
        let takeTimer = null;
        const heldNotes = new Map();

        function recordNoteOn(note) {
            if (!take) {
                take = { startedAt: performance.now(), date: Date.now(), events: [] };
            }
            clearTimeout(takeTimer);
            const event = { note, t: Math.round(performance.now() - take.startedAt), d: 0 };
            take.events.push(event);
            heldNotes.set(note, event);
        }

        function recordNoteOff(note) {
            if (!take) return;
            const event = heldNotes.get(note);
            if (event) {
                event.d = Math.max(60, Math.round(performance.now() - take.startedAt - event.t));
                heldNotes.delete(note);
            }
            if (heldNotes.size === 0) {
                clearTimeout(takeTimer);
                takeTimer = setTimeout(finishTake, 2500);
            }
        }

        function finishTake() {
            clearTimeout(takeTimer);
            if (!take) return;
            const finished = take;
            take = null;
            heldNotes.clear();
            if (finished.events.length === 0) return;
            finished.events.forEach(event => {
                if (event.d === 0) event.d = 200;
            });
            dbAdd('takes', { at: finished.date, events: finished.events })
                .then(id => logHistory('take', `Rekaman ${finished.events.length} nada`, id))
                .catch(() => {});
        }

        function keyAt(x, y) {
            const el = document.elementFromPoint(x, y);
            return el ? el.closest('.white-key, .black-key, .hk-white, .hk-black') : null;
        }

        function pressKey(el) {
            if (!el || !synth) return;
            const note = el.dataset.note;
            triggerVisualPress(note);
            synth.triggerAttack(note, Tone.immediate());
            recordNoteOn(note);
            barNoteOn(barIndexOf(note), 0.85);
        }

        function releaseKey(el) {
            if (!el || !synth) return;
            const note = el.dataset.note;
            triggerVisualRelease(note);
            synth.triggerRelease([note], Tone.immediate());
            recordNoteOff(note);
            barNoteOff(barIndexOf(note));
        }

        function createScroller(options) {
            const SPRING = 0.0006;
            const DAMPING = 0.049;
            const FRICTION = 360;
            const RESISTANCE = 0.35;
            const MAX_SPEED = 3.5;
            const s = { y: 0, vy: 0, target: 0, raw: 0, mode: 'idle', raf: 0, last: 0, dragging: false, samples: [] };

            function limit() {
                return Math.max(0, options.max());
            }

            function clampY(y, max) {
                return Math.min(max, Math.max(0, y));
            }

            function overshoot(y, max) {
                if (y < 0) return y;
                if (y > max) return y - max;
                return 0;
            }

            function fromRaw(raw, max) {
                if (raw < 0) return raw * RESISTANCE;
                if (raw > max) return max + (raw - max) * RESISTANCE;
                return raw;
            }

            function toRaw(y, max) {
                if (y < 0) return y / RESISTANCE;
                if (y > max) return max + (y - max) / RESISTANCE;
                return y;
            }

            function show() {
                options.render(s.y);
            }

            function frame(ts) {
                s.raf = 0;
                if (s.mode === 'idle') return;
                const dt = Math.min(32, Math.max(1, ts - s.last));
                s.last = ts;
                const max = limit();
                if (s.mode === 'glide') {
                    s.target = clampY(s.target, max);
                    s.y += (s.target - s.y) * (1 - Math.exp(-dt / 110));
                    if (Math.abs(s.target - s.y) < 0.25) {
                        s.y = s.target;
                        s.mode = 'idle';
                    }
                } else {
                    const over = overshoot(s.y, max);
                    if (over !== 0) s.vy += (-over * SPRING - s.vy * DAMPING) * dt;
                    else s.vy *= Math.exp(-dt / FRICTION);
                    s.y += s.vy * dt;
                    const after = overshoot(s.y, max);
                    const settledOut = after !== 0 && Math.abs(after) < 0.4 && Math.abs(s.vy) < 0.02;
                    const settledIn = after === 0 && Math.abs(s.vy) < 0.015;
                    if (settledOut || settledIn) {
                        s.y = clampY(s.y, max);
                        s.vy = 0;
                        s.mode = 'idle';
                    }
                }
                show();
                if (s.mode !== 'idle') s.raf = requestAnimationFrame(frame);
            }

            function run() {
                if (s.raf) return;
                s.last = performance.now();
                s.raf = requestAnimationFrame(frame);
            }

            s.stop = function () {
                s.mode = 'idle';
                s.vy = 0;
                s.dragging = false;
            };

            s.jump = function (y) {
                s.mode = 'idle';
                s.vy = 0;
                s.y = clampY(y, limit());
                show();
            };

            s.glide = function (target) {
                const t = clampY(target, limit());
                if (Math.abs(t - s.y) < 0.5) {
                    s.jump(t);
                    return;
                }
                s.target = t;
                s.vy = 0;
                s.mode = 'glide';
                run();
            };

            s.nudge = function (dy) {
                s.glide((s.mode === 'glide' ? s.target : s.y) + dy);
            };

            s.settle = function () {
                if (s.dragging || s.mode !== 'idle') return;
                const y = clampY(s.y, limit());
                if (y !== s.y) {
                    s.y = y;
                    show();
                }
            };

            s.dragStart = function () {
                s.mode = 'idle';
                s.vy = 0;
                s.dragging = true;
                s.raw = toRaw(s.y, limit());
                s.samples = [{ t: performance.now(), y: s.y }];
            };

            s.dragBy = function (dy) {
                if (!s.dragging) return;
                s.raw += dy;
                s.y = fromRaw(s.raw, limit());
                const now = performance.now();
                s.samples.push({ t: now, y: s.y });
                while (s.samples.length > 2 && now - s.samples[0].t > 100) s.samples.shift();
                show();
            };

            s.dragEnd = function () {
                if (!s.dragging) return;
                s.dragging = false;
                const now = performance.now();
                const first = s.samples[0];
                const last = s.samples[s.samples.length - 1];
                let v = 0;
                if (first && last && last.t > first.t && now - last.t < 80) v = (last.y - first.y) / (last.t - first.t);
                s.vy = Math.min(MAX_SPEED, Math.max(-MAX_SPEED, v));
                s.mode = 'fling';
                run();
            };

            s.dragCancel = function () {
                s.dragging = false;
                s.vy = 0;
                if (overshoot(s.y, limit()) !== 0) {
                    s.mode = 'fling';
                    run();
                } else {
                    s.mode = 'idle';
                }
            };

            return s;
        }

        const doremiScreen = document.getElementById('doremi-screen');
        const dmHead = document.getElementById('dm-head');
        const dmRoll = document.getElementById('dm-roll');
        const dmContent = document.getElementById('dm-content');
        const dmLanes = document.getElementById('dm-lanes');
        const dmRange = document.getElementById('dm-range');
        const dmThumb = document.getElementById('dm-thumb');
        const dmCanvas = document.getElementById('dm-canvas');
        const dmCtx = dmCanvas.getContext('2d');
        const dmModeH = document.getElementById('dm-mode-h');
        const dmModeV = document.getElementById('dm-mode-v');
        const DM_ROWS = allNotes.length;
        const DM_MIN_ROW = 8;
        const DM_MAX_ROW = 72;
        const DM_SLOP = 7;
        const DM_BEATS = 8;
        const dm = { mode: 'v', row: 28, keyW: 96, base: 0, count: DM_ROWS, minRow: DM_MIN_ROW, fitSong: null, init: false, pointers: new Map(), pinch: null, head: null, thumbTimer: null };
        const dmDraw = { w: 0, h: 0, dpr: 1, cache: new WeakMap(), loop: 0 };
        const dmRowOf = {};
        allNotes.forEach((note, i) => { dmRowOf[note] = DM_ROWS - 1 - i; });

        dmContent.style.setProperty('--dm-count', DM_ROWS);

        (function buildLanes() {
            const pattern = [false, true, false, true, false, true, false, false, true, false, true, false];
            const stops = pattern.map((black, i) => `${black ? '#171a22' : '#252936'} calc(var(--dm-row) * ${i}) calc(var(--dm-row) * ${i + 1})`).join(', ');
            dmLanes.style.backgroundImage = [
                'linear-gradient(to bottom, transparent calc(var(--dm-row) - 1px), rgba(0, 0, 0, 0.55) calc(var(--dm-row) - 1px))',
                'linear-gradient(to bottom, transparent calc(var(--dm-row) * 12 - 2px), rgba(255, 255, 255, 0.2) calc(var(--dm-row) * 12 - 2px))',
                `linear-gradient(to bottom, ${stops})`
            ].join(', ');
            dmLanes.style.backgroundSize = '100% var(--dm-row), 100% calc(var(--dm-row) * 12), 100% calc(var(--dm-row) * 12)';
            dmLanes.style.backgroundPosition = '0 0, 0 var(--dm-row), 0 var(--dm-row)';
        })();

        function dmViewHeight() {
            return dmRoll.clientHeight;
        }

        function dmMaxScroll() {
            return Math.max(0, dm.count * dm.row - dmViewHeight());
        }

        function dmNoteAtRow(index) {
            return allNotes[DM_ROWS - 1 - index];
        }

        function dmRowAtClientY(clientY) {
            const rect = dmRoll.getBoundingClientRect();
            const index = Math.floor((dmScroller.y + clientY - rect.top) / dm.row) + dm.base;
            return Math.max(dm.base, Math.min(dm.base + dm.count - 1, index));
        }

        function dmUpdateInfo(y) {
            if (dm.mode !== 'v') return;
            const view = dmViewHeight();
            const contentHeight = dm.count * dm.row;
            if (!view) return;
            const lastRow = dm.base + dm.count - 1;
            const top = Math.max(dm.base, Math.min(lastRow, Math.floor(y / dm.row) + dm.base));
            const bottom = Math.max(dm.base, Math.min(lastRow, Math.ceil((y + view) / dm.row) - 1 + dm.base));
            dmRange.textContent = `${dmNoteAtRow(bottom)} - ${dmNoteAtRow(top)}`;
            const thumbHeight = Math.min(view, Math.max(24, view * view / contentHeight));
            const max = dmMaxScroll();
            const ratio = max > 0 ? Math.min(1, Math.max(0, y / max)) : 0;
            dmThumb.style.height = thumbHeight + 'px';
            dmThumb.style.transform = `translateY(${ratio * (view - thumbHeight)}px)`;
            dmThumb.classList.add('show');
            clearTimeout(dm.thumbTimer);
            dm.thumbTimer = setTimeout(() => dmThumb.classList.remove('show'), 700);
        }

        const dmScroller = createScroller({
            max: dmMaxScroll,
            render: (y) => {
                dmContent.style.transform = `translate3d(0, ${-(y + dm.base * dm.row)}px, 0)`;
                dmUpdateInfo(y);
                dmDrawRoll();
            }
        });

        function dmApplyRow(row) {
            dm.row = Math.min(DM_MAX_ROW, Math.max(dm.minRow, row));
            dm.keyW = Math.min(170, Math.max(64, dm.row * 3.4));
            dmContent.style.setProperty('--dm-row', dm.row + 'px');
            dmContent.style.setProperty('--dm-key-w', dm.keyW + 'px');
            dmContent.classList.toggle('dm-fine', dm.row >= 20);
        }

        function dmUpdateMin() {
            const view = dmViewHeight();
            dm.minRow = view > 0 ? Math.min(DM_MAX_ROW, view / dm.count) : DM_MIN_ROW;
        }

        function dmFit(song) {
            const view = dmViewHeight();
            if (!view) return;
            dm.fitSong = song;
            let top = Infinity;
            let bottom = -1;
            if (song) {
                songBlocks(song).list.forEach(b => {
                    if (typeof b.row !== 'number' || isNaN(b.row)) return;
                    if (b.row < top) top = b.row;
                    if (b.row > bottom) bottom = b.row;
                });
            }
            if (bottom < 0) {
                dm.base = 0;
                dm.count = DM_ROWS;
                dm.minRow = DM_MIN_ROW;
                dmApplyRow(Math.min(40, Math.max(18, view / 12)));
                const middle = (DM_ROWS - 1 - allNotes.indexOf('C4') + 0.5) * dm.row;
                dmScroller.jump(middle - view / 2);
                return;
            }
            dm.base = top;
            dm.count = bottom - top + 1;
            dmUpdateMin();
            dmApplyRow(view / dm.count);
            dmScroller.jump(0);
        }

        function dmZoomTo(row, anchorY, anchorRows) {
            dmApplyRow(row);
            dmScroller.jump(anchorRows * dm.row - anchorY);
        }

        function dmPair() {
            const list = Array.from(dm.pointers.values());
            return list.length === 2 ? list : null;
        }

        function dmPreview(clientY) {
            const el = document.getElementById(keyId(dmNoteAtRow(dmRowAtClientY(clientY))));
            pressKey(el);
            setTimeout(() => releaseKey(el), 260);
        }

        function dmSizeCanvas() {
            const w = dmRoll.clientWidth;
            const h = dmRoll.clientHeight;
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            if (w === dmDraw.w && h === dmDraw.h && dpr === dmDraw.dpr) return;
            dmDraw.w = w;
            dmDraw.h = h;
            dmDraw.dpr = dpr;
            dmCanvas.width = Math.max(1, Math.round(w * dpr));
            dmCanvas.height = Math.max(1, Math.round(h * dpr));
            dmCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function songBlocks(song) {
            let entry = dmDraw.cache.get(song);
            if (entry) return entry;
            const list = [];
            let maxDur = 0;
            let ppq = 480;
            try {
                const midi = song.midi;
                ppq = (midi.header && midi.header.ppq) || 480;
                midi.tracks.forEach(track => {
                    track.notes.forEach(note => {
                        const row = dmRowOf[mapMidiToNote(note.midi)];
                        const dur = Math.max(1, note.durationTicks);
                        list.push({ tick: note.ticks, dur, row });
                        if (dur > maxDur) maxDur = dur;
                    });
                });
            } catch (err) {}
            list.sort((a, b) => a.tick - b.tick);
            entry = { list, maxDur, ppq };
            dmDraw.cache.set(song, entry);
            return entry;
        }

        function dmCurrentTick() {
            if (!isPlaying) return 0;
            try {
                const raw = Tone.getContext().rawContext;
                const latency = Math.min(0.5, (raw.outputLatency || 0) + (raw.baseLatency || 0));
                const time = raw.currentTime - latency;
                if (time < timeline.startTime) return 0;
                return Math.max(0, Tone.Transport.getTicksAtTime(time));
            } catch (err) {
                return 0;
            }
        }

        function dmBlockPath(x, y, w, h) {
            dmCtx.beginPath();
            if (dmCtx.roundRect) dmCtx.roundRect(x, y, w, h, 2);
            else dmCtx.rect(x, y, w, h);
        }

        function dmDrawRoll() {
            if (dm.mode !== 'v' || !doremiScreen.classList.contains('shown')) return;
            dmSizeCanvas();
            const w = dmDraw.w;
            const h = dmDraw.h;
            dmCtx.clearRect(0, 0, w, h);
            const song = playingSong || playlist[currentFileIndex];
            if (!song) return;
            if (dm.fitSong !== song) {
                dmFit(song);
                return;
            }
            const data = songBlocks(song);
            const keyW = dm.keyW;
            const laneW = w - keyW;
            if (laneW <= 0 || !data.list.length) return;
            const pxPerTick = (laneW / DM_BEATS) / data.ppq;
            const now = dmCurrentTick();
            const endTick = now + laneW / pxPerTick;
            const rowH = dm.row;
            const scrollY = dmScroller.y;
            const list = data.list;
            let lo = 0;
            let hi = list.length;
            const minTick = now - data.maxDur;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (list[mid].tick < minTick) lo = mid + 1;
                else hi = mid;
            }
            dmCtx.save();
            dmCtx.beginPath();
            dmCtx.rect(keyW, 0, laneW, h);
            dmCtx.clip();
            for (let i = lo; i < list.length; i++) {
                const b = list[i];
                if (b.tick > endTick) break;
                const bw = Math.max(2, b.dur * pxPerTick - 1);
                const x = keyW + (b.tick - now) * pxPerTick;
                if (x + bw < keyW) continue;
                const y = (b.row - dm.base) * rowH - scrollY;
                if (y + rowH < 0 || y > h) continue;
                const active = b.tick <= now && now < b.tick + b.dur;
                dmBlockPath(x, y + 1, bw, rowH - 2);
                dmCtx.fillStyle = active ? '#ffd24d' : '#3fa9f5';
                dmCtx.fill();
                dmCtx.strokeStyle = active ? 'rgba(255, 255, 255, 0.7)' : 'rgba(255, 255, 255, 0.28)';
                dmCtx.lineWidth = 1;
                dmCtx.stroke();
            }
            dmCtx.restore();
        }

        function dmLoopFrame() {
            dmDraw.loop = 0;
            dmDrawRoll();
            if (isPlaying && dm.mode === 'v' && doremiScreen.classList.contains('shown')) {
                dmDraw.loop = requestAnimationFrame(dmLoopFrame);
            }
        }

        function dmEnsureLoop() {
            if (dmDraw.loop || !isPlaying || dm.mode !== 'v' || !doremiScreen.classList.contains('shown')) return;
            dmDraw.loop = requestAnimationFrame(dmLoopFrame);
        }

        const hzScroll = document.getElementById('hz-scroll');
        const hzKeys = document.getElementById('hz-keys');
        const hzNav = document.getElementById('hz-nav');
        const hzThumb = document.getElementById('hz-nthumb');
        const whiteNotes = allNotes.filter(note => !note.includes('#'));
        const hz = { x: 0, init: false, pointers: new Map() };

        (function buildHzTicks() {
            for (let octave = 0; octave <= 10; octave++) {
                const tick = document.createElement('div');
                tick.className = 'hz-tick';
                tick.style.left = (octave * 7 / whiteNotes.length * 100) + '%';
                tick.textContent = 'C' + octave;
                hzNav.appendChild(tick);
            }
        })();

        function hzKeyWidth() {
            return hzScroll.clientWidth / 36;
        }

        function hzTotalWidth() {
            return hzKeyWidth() * whiteNotes.length;
        }

        const hzScroller = createScroller({
            max: () => Math.max(0, hzTotalWidth() - hzScroll.clientWidth),
            render: (value) => {
                const x = Math.min(Math.max(0, hzTotalWidth() - hzScroll.clientWidth), Math.max(0, value));
                hz.x = x;
                hzKeys.style.transform = `translate3d(${-x}px, 0, 0)`;
                hzUpdate();
            }
        });

        let hzThumbW = -1;
        let hzLastRange = '';

        function hzUpdate() {
            const cw = hzScroll.clientWidth;
            if (!cw) return;
            const kw = cw / 36;
            hz.kwPrev = kw;
            const thumbW = cw / (kw * whiteNotes.length) * 100;
            if (thumbW !== hzThumbW) {
                hzThumbW = thumbW;
                hzThumb.style.width = thumbW + '%';
            }
            hzThumb.style.transform = `translate3d(${hz.x / cw * 100}%, 0, 0)`;
            if (dm.mode !== 'h') return;
            const first = Math.min(whiteNotes.length - 1, Math.max(0, Math.round(hz.x / kw)));
            const last = Math.min(whiteNotes.length - 1, first + Math.round(cw / kw) - 1);
            const text = `${whiteNotes[first]} - ${whiteNotes[last]}`;
            if (text !== hzLastRange) {
                hzLastRange = text;
                dmRange.textContent = text;
            }
        }

        hzScroll.addEventListener('pointerdown', (e) => {
            if (!isPowerOn || !synth) return;
            e.preventDefault();
            hzScroll.setPointerCapture(e.pointerId);
            const el = keyAt(e.clientX, e.clientY);
            hz.pointers.set(e.pointerId, { el });
            pressKey(el);
        });

        hzScroll.addEventListener('pointermove', (e) => {
            const p = hz.pointers.get(e.pointerId);
            if (!p) return;
            const el = keyAt(e.clientX, e.clientY);
            if (el === p.el) return;
            releaseKey(p.el);
            p.el = el;
            pressKey(el);
        });

        function hzEndPointer(e) {
            const p = hz.pointers.get(e.pointerId);
            if (!p) return;
            releaseKey(p.el);
            hz.pointers.delete(e.pointerId);
        }

        hzScroll.addEventListener('pointerup', hzEndPointer);
        hzScroll.addEventListener('pointercancel', hzEndPointer);
        hzScroll.addEventListener('lostpointercapture', hzEndPointer);
        hzScroll.addEventListener('contextmenu', (e) => e.preventDefault());
        let hzNavDragging = false;
        let hzNavLast = 0;
        let hzNavWidth = 1;

        function hzNavEnd() {
            if (!hzNavDragging) return;
            hzNavDragging = false;
            hzScroller.dragEnd();
        }

        function hzNavAbort() {
            if (!hzNavDragging) return;
            hzNavDragging = false;
            hzScroller.dragCancel();
        }

        hzNav.addEventListener('pointerdown', (e) => {
            hzNavDragging = true;
            hzNav.setPointerCapture(e.pointerId);
            hzNavLast = e.clientX;

        const dmSheet = { y: 0, dir: 'up', raf: 0 };

        function dmSheetHeight() {
            return doremiScreen.clientHeight || 1;
        }

        function dmSheetApply() {
            const h = dmSheetHeight();
            doremiScreen.style.transform = `translate3d(0, ${dmSheet.y}px, 0)`;
            const fade = dmSheet.dir === 'down' ? Math.min(1, Math.max(0, (h - dmSheet.y) / 5)) : 1;
            doremiScreen.style.opacity = String(fade);
        }

        function dmSheetStop() {
            cancelAnimationFrame(dmSheet.raf);
            dmSheet.raf = 0;
        }

        function dmSheetTo(target, dir, onDone) {
            dmSheetStop();
            dmSheet.dir = dir;
            const from = dmSheet.y;
            const distance = target - from;
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const share = Math.max(0.35, Math.min(1, Math.abs(distance) / dmSheetHeight()));
            const duration = reduce || Math.abs(distance) < 1 ? 0 : (dir === 'down' ? 360 : 480) * share;
            if (!duration) {
                dmSheet.y = target;
                dmSheetApply();
                if (onDone) onDone();
                return;
            }
            const t0 = performance.now();
            const step = (now) => {
                const t = Math.min(1, (now - t0) / duration);
                const eased = dir === 'down' ? Math.pow(t, 2.2) : 1 - Math.pow(1 - t, 4);
                dmSheet.y = from + distance * eased;
                dmSheetApply();
                if (t < 1) {
                    dmSheet.raf = requestAnimationFrame(step);
                } else {
                    dmSheet.raf = 0;
                    if (onDone) onDone();
                }
            };
            dmSheet.raf = requestAnimationFrame(step);
        }

        dmRoll.addEventListener('pointerdown', (e) => {
            if (!isPowerOn || !synth) return;
            e.preventDefault();
            try { dmRoll.setPointerCapture(e.pointerId); } catch (err) {}
            if (dm.pointers.size >= 2) return;
            const onKeys = !!e.target.closest('.dm-keys');
            const p = {
                zone: onKeys ? 'keys' : 'grid',
                el: null,
                x: e.clientX,
                y: e.clientY,
                sx: e.clientX,
                sy: e.clientY,
                ly: e.clientY,
                moved: false,
                locked: false
            };
            dm.pointers.set(e.pointerId, p);
            const pair = dmPair();
            if (pair) {
                dmScroller.dragCancel();
                pair.forEach(q => { if (q.zone === 'grid') q.locked = true; });
                dm.pinch = {
                    active: false,
                    d0: Math.max(1, Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y)),
                    row0: dm.row,
                    anchorRows: 0
                };
            }
            if (onKeys) {
                p.el = keyAt(e.clientX, e.clientY);
                pressKey(p.el);
            } else if (!pair) {
                dmScroller.dragStart();
            }
        });

        dmRoll.addEventListener('pointermove', (e) => {
            const p = dm.pointers.get(e.pointerId);
            if (!p) return;
            p.x = e.clientX;
            p.y = e.clientY;
            const pair = dmPair();
            if (pair && dm.pinch) {
                const d = Math.max(1, Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y));
                const rect = dmRoll.getBoundingClientRect();
                const midY = (pair[0].y + pair[1].y) / 2 - rect.top;
                const bothMoved = pair.every(q => Math.hypot(q.x - q.sx, q.y - q.sy) > 6);
                if (!dm.pinch.active && bothMoved && Math.abs(d - dm.pinch.d0) > 12) {
                    dm.pinch.active = true;
                    pair.forEach(q => {
                        releaseKey(q.el);
                        q.el = null;
                        q.locked = true;
                    });
                    dm.pinch.d0 = d;
                    dm.pinch.row0 = dm.row;
                    dm.pinch.anchorRows = (dmScroller.y + midY) / dm.row;
                }
                if (dm.pinch.active) {
                    dmZoomTo(dm.pinch.row0 * d / dm.pinch.d0, midY, dm.pinch.anchorRows);
                    return;
                }
            }
            if (p.locked) return;
            if (p.zone === 'keys') {
                const el = keyAt(e.clientX, e.clientY);
                if (el === p.el) return;
                releaseKey(p.el);
                p.el = el;
                pressKey(el);
                return;
            }
            if (!p.moved) {
                if (Math.hypot(p.x - p.sx, p.y - p.sy) < DM_SLOP) return;
                p.moved = true;
                p.ly = p.y;
                return;
            }
            dmScroller.dragBy(p.ly - p.y);
            p.ly = p.y;
        });

        function dmEndPointer(e) {
            const p = dm.pointers.get(e.pointerId);
            if (!p) return;
            dm.pointers.delete(e.pointerId);
            if (p.zone === 'keys') {
                releaseKey(p.el);
            } else if (!p.locked) {
                if (p.moved) {
                    dmScroller.dragEnd();
                } else {
                    dmScroller.dragCancel();
                    if (e.type === 'pointerup') dmPreview(p.y);
                }
            }
            if (dm.pointers.size < 2) {
                if (dm.pinch && dm.pinch.active) dm.pointers.forEach(q => { q.locked = true; });
                dm.pinch = null;
            }
        }

        dmHead.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || dm.head) return;
            dm.head = {
                id: e.pointerId,
                x0: e.clientX,
                y0: e.clientY,
                axis: null,
                row0: dm.row,
                anchorRows: (dmScroller.y + dmViewHeight() / 2) / dm.row,
