        dmHead.addEventListener('pointermove', (e) => {
            const g = dm.head;
            if (!g || e.pointerId !== g.id) return;
            const dx = e.clientX - g.x0;
            const dy = e.clientY - g.y0;
            if (!g.axis) {
                if (Math.hypot(dx, dy) < 8) return;
                g.axis = (Math.abs(dy) > Math.abs(dx) || dm.mode !== 'v') ? 'sheet' : 'zoom';
                if (g.axis === 'sheet') dmSheetStop();
            }
            if (g.axis === 'zoom') {
                dmZoomTo(g.row0 * Math.exp(dx * 0.0055), dmViewHeight() / 2, g.anchorRows);
                return;
            }
            const next = Math.min(dmSheetHeight(), Math.max(0, g.sy0 + dy));
            if (next > dmSheet.y) dmSheet.dir = 'down';
            else if (next < dmSheet.y) dmSheet.dir = 'up';
            dmSheet.y = next;
            dmSheetApply();
            const now = performance.now();
            g.samples.push({ t: now, y: next });
            while (g.samples.length > 2 && now - g.samples[0].t > 120) g.samples.shift();
        });

        function dmEndHead(e) {
            const g = dm.head;
            if (!g || e.pointerId !== g.id) return;
            dm.head = null;
            if (g.axis !== 'sheet') return;
            const first = g.samples[0];
            const last = g.samples[g.samples.length - 1];
            const v = last.t > first.t ? (last.y - first.y) / (last.t - first.t) : 0;
            if (e.type === 'pointerup' && (dmSheet.y > dmSheetHeight() * 0.3 || v > 0.6)) closeDoremi();
            else dmSheetTo(0, 'up');
        }

        function isMidiFile(file) {
            return /\.(mid|midi)$/i.test(file.name) || /midi/i.test(file.type);
        }

        function isImageFile(file) {

        let uploadTimer = null;

            };

        async function addSong(file) {
            const buffer = await file.arrayBuffer();
            let parsed;
            try {
                parsed = new Midi(buffer);
            } catch (err) {
                return ["ERR: INVALID MIDI", 2000];
            }
            const existing = playlist.findIndex(item => item.name === file.name && item.size === buffer.byteLength);
            if (existing !== -1) {
                currentFileIndex = existing;
                saveSettings();
                updateUI();
                return;
            }
            let id;
            try {
                id = await dbAdd('songs', { name: file.name, data: buffer, addedAt: Date.now() });
            } catch (e) {
                id = -(++tempSongId);
            }
            playlist.push({ id, name: file.name, midi: parsed, size: buffer.byteLength });
            rebuildPlaylist();
            focusSong(id, false);
            logHistory('song', file.name, id);
            updateUI();
        }

        async function addImage(file) {
            const valid = await checkImage(file);
            if (!valid) {
                return ["ERR: INVALID IMAGE", 2000];
            }
            let id = null;
            try {
                id = await dbAdd('images', { name: file.name, blob: file, addedAt: Date.now() });
            } catch (e) {
                id = null;
            }
            backgroundId = id;
            applyBackground(file);
            saveSettings();
            if (id !== null) {
                logHistory('image', file.name, id);
                pruneImages();
            }
            return ["BG: " + file.name, 1800];
        }

        midiInput.addEventListener('change', async (e) => {
            if (!isPowerOn) return;
            const files = Array.from(e.target.files || []);
            e.target.value = '';
            if (!files.length) return;

            const startedAt = performance.now();
            startUploading();
            let notice = null;
            let lastImage = null;
            try {
                for (const file of files) {
                    if (isMidiFile(file)) {
                        const result = await addSong(file);
                        if (result) notice = result;
                    } else if (isImageFile(file)) {
                        lastImage = file;
                    } else {
                        notice = ["ERR: FILE TYPE", 2000];
                    }
                }
                if (lastImage) {
                    const result = await addImage(lastImage);
                    if (result) notice = result;
                }
                const wait = 1100 - (performance.now() - startedAt);
                if (wait > 0) await new Promise(resolve => setTimeout(resolve, wait));
            } finally {
                stopUploading();
            }
            if (notice) flashTrack(notice[0], notice[1]);
        });

        const PLIST_ROWS = 7;
        const PLIST_SLOP = 6;
        const plist = { rowH: 0, viewH: 0, rows: new Map(), emptyEl: null, seen: -1, init: false, id: null, sy: 0, ly: 0, moved: false, thumbTimer: null };
        let plistTimer = null;

        function plistMax() {
            return Math.max(0, playlist.length * plist.rowH - plist.viewH);
        }

        function plistMeasure() {
            const height = lcdProws.getBoundingClientRect().height;
            if (!height) return false;

            plist.rowH = height / PLIST_ROWS;

        }

        function plistFillRow(el, index) {
            const selected = index === currentFileIndex;
            el.className = selected ? 'lcd-prow sel' : 'lcd-prow';
            el.textContent = '';
            if (selected) {
                const arrow = document.createElement('span');
                arrow.className = 'arr';
                arrow.textContent = '->';
                el.appendChild(arrow);
            }
            el.appendChild(document.createTextNode(playlist[index].name.replace(/\.midi?$/i, '')));
        }

        function plistLayoutRows(y) {
            if (!plist.rowH) return;
            const total = playlist.length;
            const first = Math.max(0, Math.floor(y / plist.rowH));
            const last = Math.min(total - 1, Math.floor((y + plist.viewH) / plist.rowH));
            plist.rows.forEach((el, index) => {
                if (index < first || index > last) {
                    el.remove();
                    plist.rows.delete(index);
                }
            });
            for (let i = first; i <= last; i++) {
                let el = plist.rows.get(i);
                if (!el) {
                    el = document.createElement('div');
                    plistFillRow(el, i);
                    lcdProws.appendChild(el);
                    plist.rows.set(i, el);
                }
                el.style.transform = `translate3d(0, ${i * plist.rowH - y}px, 0)`;
            }
        }

        function plistShowThumb(y) {
            const content = playlist.length * plist.rowH;
            if (content <= plist.viewH) {
                lcdPthumb.classList.remove('show');
                return;
            }
            const thumbHeight = Math.max(8, plist.viewH * plist.viewH / content);
            const ratio = Math.min(1, Math.max(0, y / (content - plist.viewH)));
            lcdPthumb.style.height = thumbHeight + 'px';
            lcdPthumb.style.transform = `translateY(${ratio * (plist.viewH - thumbHeight)}px)`;
            lcdPthumb.classList.add('show');
            clearTimeout(plist.thumbTimer);
            plist.thumbTimer = setTimeout(() => lcdPthumb.classList.remove('show'), 700);
        }

        const plistScroller = createScroller({
            max: plistMax,
            render: (y) => {
                plistLayoutRows(y);
                plistShowThumb(y);
            }
        });

        function plistReveal(instant) {
            const top = currentFileIndex * plist.rowH;
            let target = plistScroller.y;
            if (top < target) target = top;
            else if (top + plist.rowH > target + plist.viewH) target = top + plist.rowH - plist.viewH;
            target = Math.min(plistMax(), Math.max(0, target));
            if (instant) plistScroller.jump(target);
            else plistScroller.glide(target);

        function setScreen(mode) {

            plistBarReset();

            if (mode === 'plist') {
                if (plistMeasure()) {
                    if (!plist.init) {
                        plist.init = true;
                        plistScroller.jump(Math.min(plistMax(), currentFileIndex * plist.rowH));
                    } else {
                        plistReveal(true);
                    }
                    plist.seen = currentFileIndex;
                }
                renderPlaylist();
            }
        }

        function renderPlaylist() {
            const total = playlist.length;
            renderPnum();
            if (!plistMeasure()) return;
            if (total === 0) {
                plist.rows.forEach(el => el.remove());
                plist.rows.clear();
                if (!plist.emptyEl) {
                    plist.emptyEl = document.createElement('div');
                    plist.emptyEl.className = 'lcd-pempty';
                    plist.emptyEl.textContent = 'No Songs Found.';
                }
                if (!plist.emptyEl.parentNode) lcdProws.appendChild(plist.emptyEl);
                plistScroller.jump(0);
                return;
            }
            if (plist.emptyEl && plist.emptyEl.parentNode) plist.emptyEl.remove();
            plist.rows.forEach((el, index) => {
                if (index >= total) {
                    el.remove();
                    plist.rows.delete(index);
                } else {
                    plistFillRow(el, index);
                }
            });
            if (plist.seen !== currentFileIndex) {
                plist.seen = currentFileIndex;
                if (!plistScroller.dragging) plistReveal(false);
            }
            plistScroller.settle();
            plistLayoutRows(plistScroller.y);
        }

        lcdProws.addEventListener('pointerdown', (e) => {
            if (!isPowerOn || screenMode !== 'plist' || confirmState.open || plist.id !== null) return;
            if (playlist.length === 0) return;
            plist.id = e.pointerId;
            plist.sy = e.clientY;
            plist.ly = e.clientY;
            plist.moved = false;
            try { lcdProws.setPointerCapture(e.pointerId); } catch (err) {}
            plistScroller.dragStart();
        });

        lcdProws.addEventListener('pointermove', (e) => {
            if (e.pointerId !== plist.id) return;
            if (!plist.moved) {
                if (Math.abs(e.clientY - plist.sy) < PLIST_SLOP) return;
                plist.moved = true;
                plist.ly = e.clientY;
                return;
            }
            plistScroller.dragBy(plist.ly - e.clientY);
            plist.ly = e.clientY;
        });

        function plistEnd(e) {
            if (e.pointerId !== plist.id) return;
            plist.id = null;
            if (plist.moved) {
                plistScroller.dragEnd();
                return;
            }
            plistScroller.dragCancel();
            if (e.type !== 'pointerup') return;
            const rect = lcdProws.getBoundingClientRect();
            const index = Math.floor((plistScroller.y + e.clientY - rect.top) / plist.rowH);
            if (index >= 0 && index < playlist.length && index !== currentFileIndex) scrollSong(index - currentFileIndex);
        }

        lcdProws.addEventListener('pointerup', plistEnd);
        lcdProws.addEventListener('pointercancel', plistEnd);
        lcdProws.addEventListener('lostpointercapture', plistEnd);

        lcdProws.addEventListener('wheel', (e) => {
            if (screenMode !== 'plist' || confirmState.open) return;
            e.preventDefault();
            plistScroller.nudge(e.deltaY);
        }, { passive: false });

        window.addEventListener('resize', () => {
            if (screenMode !== 'plist' || !plist.rowH) return;
            const rows = plistScroller.y / plist.rowH;
            if (plistMeasure()) {
                plistScroller.jump(rows * plist.rowH);
                renderPlaylist();
            }
        });

        function scrollSong(delta) {
            const total = playlist.length;
            if (total === 0) return;
            const restart = screenMode !== 'plist';
            queued = restart ? false : isPlaying;
            scrollBusy = true;
            currentFileIndex = (((currentFileIndex + delta) % total) + total) % total;
            updateUI();
            clearTimeout(plistTimer);
            plistTimer = setTimeout(() => {
                scrollBusy = false;
                saveSettings();
                const song = playlist[currentFileIndex];
                if (!song) return;
                logHistory('pilih', song.name, song.id);
                if (isPlaying && restart) playMIDI();
                else updateUI();
            }, 300);
        }

        const chord = { prev: false, next: false, active: false, timer: null };
        const hold = { timer: null, fired: false, steps: 0 };

        function holdStop() {
            clearTimeout(hold.timer);
            hold.timer = null;
        }

        function songDelta(which) {
            const forward = which === 'next';
            const flip = screenMode === 'plist';
            return forward !== flip ? 1 : -1;
        }

        function holdTick(which) {
            if (!isPowerOn || confirmState.open || chord.active) {
                holdStop();
                return;
            }
            hold.fired = true;
            const stride = Math.min(4, 1 + Math.floor(hold.steps / 15));
            hold.steps++;
            scrollSong(songDelta(which) * stride);
            const gap = Math.max(45, 170 - hold.steps * 9);
            hold.timer = setTimeout(() => holdTick(which), gap);
        }

        function holdStart(which) {
            holdStop();
            hold.fired = false;
            hold.steps = 0;
            if (!isPowerOn || playlist.length < 2 || confirmState.open) return;
            if (chord.active || (chord.prev && chord.next)) return;
            hold.timer = setTimeout(() => holdTick(which), 380);
        }

        function chordDown(which) {
            if (!isPowerOn || confirmState.open) return;
            chord[which] = true;
            if (chord.prev && chord.next && !chord.active) {
                chord.active = true;
                holdStop();
                clearTimeout(chord.timer);
                setScreen(screenMode === 'plist' ? 'normal' : 'plist');
            }
        }

        function chordUp(which) {
            chord[which] = false;
            if (chord.active && !chord.prev && !chord.next) {
                clearTimeout(chord.timer);
                chord.timer = setTimeout(() => { chord.active = false; }, 120);
            }
        }

        [['prev', btnPrev], ['next', btnNext]].forEach(([which, el]) => {
            el.addEventListener('pointerdown', () => {
                chordDown(which);
                holdStart(which);
            });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
                el.addEventListener(type, () => {
                    chordUp(which);
                    holdStop();
                });
            });
            el.addEventListener('contextmenu', (e) => e.preventDefault());
        });

        function onSongButton(which) {
            if (hold.fired) {
                hold.fired = false;
                return;
            }
            if (chord.active) return;
            if (!isPowerOn) return;
            if (confirmState.open) {
                setConfirmChoice(which === 'prev');
                return;
            }
            if (playlist.length === 0) return;
            if (screenMode === 'plist') {
                scrollSong(songDelta(which));
                return;
            }
            selectSong((currentFileIndex + songDelta(which) + playlist.length) % playlist.length);
        }

        btnPrev.addEventListener('click', () => onSongButton('prev'));
        btnNext.addEventListener('click', () => onSongButton('next'));

        btnPlay.addEventListener('click', () => {
            if (!isPowerOn) return;
            if (playlist.length === 0) {
                flashTrack("NO MIDI DATA", 1500);
                return;
            }
            const fromList = screenMode === 'plist';
            if (fromList) setScreen('normal');
            const song = playlist[currentFileIndex];
            const switchNow = fromList && playingSong && song !== playingSong;
            if (isPlaying && !switchNow) {
                stopMIDI();
            } else {
                logHistory('play', song.name, song.id);
                playMIDI();
            }
        });

        let replayTimers = [];

        function playMIDI() {
            stopMIDI();
            const song = playlist[currentFileIndex];
            if (!song) return;
            let midiData = null;
            try {
                midiData = song.midi;
            } catch (err) {
                midiData = null;
            }
            if (!midiData) {
                flashTrack("ERR: INVALID MIDI", 2000);
                return;
            }
            tempo = songTempo(song);
            tempoFor = song;
            isPlaying = true;
            playingSong = song;
            queued = false;
            btnPlay.classList.add('active-play');
            updateUI();
            marqueeStart();

            clearTimeout(barsEnterTimer);
            enterBars();

            Tone.Transport.PPQ = midiData.header.ppq;
            Tone.Transport.bpm.value = tempo;

            const groups = new Map();
            const events = [];
            let endTick = 0;

            midiData.tracks.forEach(track => {
                track.notes.forEach(note => {
                    const targetNote = mapMidiToNote(note.midi);
                    const index = noteIndex[targetNote];
                    const duration = Math.max(1, note.durationTicks);
                    const velocity = note.velocity;
                    let group = groups.get(note.ticks);
                    if (!group) {
                        group = [];
                        groups.set(note.ticks, group);
                    }
                    group.push({ note: targetNote, duration, velocity });
                    events.push({ tick: note.ticks, index, on: true, velocity });
                    events.push({ tick: note.ticks + duration, index, on: false, velocity: 0 });
                    if (note.ticks + duration > endTick) endTick = note.ticks + duration;
                });
            });

            events.sort((a, b) => (a.tick - b.tick) || (a.on === b.on ? 0 : (a.on ? 1 : -1)));

            const startTime = Tone.now() + 0.05;
            timeline.events = events;
            timeline.pointer = 0;
            timeline.endTick = endTick;
            timeline.doneAt = 0;
            timeline.startTime = startTime;

            groups.forEach((group, tick) => {
                Tone.Transport.schedule((time) => {
                    const active = synth;
                    if (!active) return;
                    for (let i = 0; i < group.length; i++) {
                        const item = group[i];
                        try {
                            active.triggerAttackRelease(item.note, item.duration + "i", time, item.velocity);
                        } catch (err) {}
                    }
                }, tick + "i");
            });

            Tone.Transport.start(startTime);
            ensureBarsLoop();
            dmEnsureLoop();
        }

        function stopMIDI() {
            const wasPlaying = isPlaying;
            isPlaying = false;
            playingSong = null;
            queued = false;
            btnPlay.classList.remove('active-play');
            clearTimeout(barsEnterTimer);
            replayTimers.forEach(clearTimeout);
            replayTimers = [];
            timeline.events = [];
            timeline.pointer = 0;
            Tone.Transport.stop();
            Tone.Transport.cancel();
            if (synth) synth.releaseAll();
            barHolds.fill(0);
            keyGroups.forEach(group => group.forEach(el => el.classList.remove('pressed')));
            if (wasPlaying) marqueeStop();
            updateUI();
        }

        async function replayTake(id) {
            let record = null;
            try {
                record = await dbGet('takes', id);
            } catch (e) {
                record = null;
            }
            if (!record) {
                panelNotice('Rekaman tidak ditemukan.');
                return;
            }
            stopMIDI();
            let end = 0;
            record.events.forEach(event => {
                replayTimers.push(setTimeout(() => {
                    synth.triggerAttackRelease(event.note, event.d / 1000, Tone.immediate());
                    triggerVisualPress(event.note);
                    barNoteOn(barIndexOf(event.note), 0.85);
                }, event.t));
                replayTimers.push(setTimeout(() => {
                    triggerVisualRelease(event.note);
                    barNoteOff(barIndexOf(event.note));
                }, event.t + event.d));
                end = Math.max(end, event.t + event.d);
            });
            flashTrack(`REPLAY ${record.events.length} NADA`, end + 400);
            panelNotice('Memutar rekaman.');
        }

        const historyList = document.getElementById('history-list');
        const historyNotice = document.getElementById('history-notice');
        let noticeTimer = null;

        const typeTags = { song: 'LAGU', image: 'GAMBAR', take: 'REKAM', tempo: 'TEMPO', mode: 'SUARA', play: 'PLAY', pilih: 'PILIH', power: 'PWR' };
        const actionLabels = { song: 'PILIH', pilih: 'PILIH', image: 'PAKAI', take: 'PUTAR', tempo: 'PAKAI' };

        function panelNotice(text) {
            historyNotice.textContent = text;
            clearTimeout(noticeTimer);
            noticeTimer = setTimeout(() => { historyNotice.textContent = ''; }, 2400);
        }

        function formatTime(at) {
            return new Date(at).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        async function renderHistory() {
            let items = [];
            try {
                items = await dbAll('history');
            } catch (e) {
                items = [];
            }
            items.sort((a, b) => b.id - a.id);
            historyList.textContent = '';

            if (!items.length) {
                const empty = document.createElement('div');
                empty.className = 'history-empty';
                empty.textContent = 'Belum ada riwayat.';
                historyList.appendChild(empty);
                return;
            }

            items.slice(0, 150).forEach(item => {
                const row = document.createElement('div');
                row.className = 'history-item';

                const tag = document.createElement('span');
                tag.className = 'history-tag t-' + item.type;
                tag.textContent = typeTags[item.type] || String(item.type).toUpperCase();

                const main = document.createElement('div');
                main.className = 'history-main';
                const label = document.createElement('div');
                label.className = 'history-label';
                label.textContent = item.label;
                const time = document.createElement('div');
                time.className = 'history-time';
                time.textContent = formatTime(item.at);
                main.appendChild(label);
                main.appendChild(time);

                row.appendChild(tag);
                row.appendChild(main);

                if (actionLabels[item.type]) {
                    const button = document.createElement('button');
                    button.className = 'h-btn';
                    button.type = 'button';
                    button.textContent = actionLabels[item.type];
                    button.addEventListener('click', () => runHistoryAction(item));
                    row.appendChild(button);
                }

                historyList.appendChild(row);
            });
        }

        async function runHistoryAction(item) {
            if (item.type === 'song' || item.type === 'pilih') {
                const index = playlist.findIndex(song => song.id === item.ref);
                if (index === -1) {
                    panelNotice('Lagu sudah dihapus.');
                    return;
                }
                currentFileIndex = index;
                saveSettings();
                if (isPowerOn && isPlaying) playMIDI();
                else updateUI();
                panelNotice('Lagu dipilih.');
            } else if (item.type === 'image') {
                if (item.ref === null) {
                    backgroundId = null;
                    applyBackground(null);
                    saveSettings();
                    panelNotice('Background bawaan dipakai.');
                    return;
                }
                let record = null;
                try {
                    record = await dbGet('images', item.ref);
                } catch (e) {
                    record = null;
                }
                if (!record) {
                    panelNotice('Gambar sudah dihapus.');
                    return;
                }
                backgroundId = record.id;
                applyBackground(record.blob);
                saveSettings();
                logHistory('image', record.name, record.id);
                panelNotice('Background dipakai.');
            } else if (item.type === 'tempo') {
                tempo = item.ref;
                Tone.Transport.bpm.value = tempo;
                saveSettings();
                updateUI();
                panelNotice('Tempo diterapkan.');
            } else if (item.type === 'take') {
                if (!isPowerOn) {
                    panelNotice('Nyalakan PWR dulu.');
                    return;
                }
                replayTake(item.ref);
            }
        }

        function openHistory() {
            document.body.classList.add('history-open');
            renderHistory();
        }

        function closeHistory() {
            document.body.classList.remove('history-open');
        }

        lcdTrack.addEventListener('click', openHistory);
        document.getElementById('history-close').addEventListener('click', closeHistory);
        document.getElementById('history-backdrop').addEventListener('click', closeHistory);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeHistory();
        });

        document.getElementById('hist-default-bg').addEventListener('click', () => {
            backgroundId = null;
            applyBackground(null);
            saveSettings();
            logHistory('image', 'Background bawaan', null);
            panelNotice('Background bawaan dipakai.');
        });

        document.getElementById('hist-clear-songs').addEventListener('click', () => {
            stopMIDI();
            playlist = playlist.filter(song => song.cloud);
            currentFileIndex = 0;
            dbClear('songs').catch(() => {});
            saveSettings();
            updateUI();
            panelNotice('Semua lagu dihapus.');
        });

        document.getElementById('hist-clear').addEventListener('click', () => {
            dbClear('history').then(renderHistory).catch(() => {});
        });

        const logoImg = document.getElementById('logo-img');
        const logoFrame = document.querySelector('.logo-frame');
        const logoSource = logoImg.getAttribute('src');
        let logoAttempts = 0;

        function logoReady() {
            logoFrame.classList.add('ready');
        }

        logoImg.addEventListener('load', logoReady);
        logoImg.addEventListener('error', () => {
            if (logoAttempts >= 6) return;
            logoAttempts++;
            setTimeout(() => {
                logoImg.src = `${logoSource}?retry=${logoAttempts}`;
            }, 1200 * logoAttempts);
        });

        if (logoImg.complete && logoImg.naturalWidth > 0) logoReady();
        setTimeout(logoReady, 2500);

        const FB_CONFIG = {
            apiKey: "AIzaSyDpRllLIJ346sw9FNM0KF7H1B_HAftAIkI",
            authDomain: "ryzmusical.firebaseapp.com",
            projectId: "ryzmusical",
            storageBucket: "ryzmusical.firebasestorage.app",
            messagingSenderId: "934193972979",
            appId: "1:934193972979:web:a31ffe822e7d2e9fd8d986",
            measurementId: "G-80WXWJD34L"
        };
        const FB_COLLECTION = 'midi_songs';
        const cloudSongs = new Map();
        const hiddenCloud = new Set();

        function saveHiddenCloud() {
            dbPut('kv', { key: 'hiddenCloud', ids: Array.from(hiddenCloud) }).catch(() => {});
        }

        function songNumber(song) {
            const m = /^\W*(\d{5})(?!\d)/.exec(song.name);
            return m ? parseInt(m[1], 10) : -Infinity;
        }

        let wantedTrackId = null;
        let dbSynced = false;

        function focusSong(id, announce) {
            const index = playlist.findIndex(song => song.id === id);
            if (index === -1) return;
            currentFileIndex = index;
            queued = isPlaying;
            saveSettings();
            if (announce && isPowerOn) {
                flashTrack('BARU: ' + playlist[index].name.replace(/\.midi?$/i, ''), 1800);
            }
        }

        function base64ToBuffer(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }

        function makeCloudSong(docId, data, addedAt) {
            const b64 = data.data;
            const pad = b64.endsWith('==') ? 2 : (b64.endsWith('=') ? 1 : 0);
            const song = {
                id: 'c:' + docId,
                name: data.name || 'Tanpa Judul',
                size: Math.floor(b64.length * 3 / 4) - pad,
                cloud: true,
                addedAt
            };
            let parsed = null;
            Object.defineProperty(song, 'midi', {
                enumerable: true,
                get() {
                    if (!parsed) parsed = new Midi(base64ToBuffer(b64));
                    return parsed;
                }
            });
            return song;
        }

        function rebuildPlaylist() {
            const currentId = playlist[currentFileIndex] ? playlist[currentFileIndex].id : null;
            const cloud = Array.from(cloudSongs.values()).filter(song => !hiddenCloud.has(song.id));
            const local = playlist.filter(song => !song.cloud);
            const all = cloud.concat(local);
            all.forEach((song, order) => { song._order = order; });
            all.sort((a, b) => {
                const na = songNumber(a);
                const nb = songNumber(b);
                if (na !== nb) return na < nb ? -1 : 1;
                if (na === -Infinity) {
                    if (!!a.cloud !== !!b.cloud) return a.cloud ? -1 : 1;
                    if (a.cloud) return a.name.localeCompare(b.name, undefined, { numeric: true });
                    return a._order - b._order;
                }
                return a.name.localeCompare(b.name, undefined, { numeric: true })
                    || ((a.addedAt || 0) - (b.addedAt || 0))
                    || (a._order - b._order);
            });
            playlist = all;

            let index = -1;
            if (wantedTrackId !== null) {
                index = playlist.findIndex(song => song.id === wantedTrackId);
                if (index !== -1) wantedTrackId = null;
            }
            if (index === -1 && currentId !== null) index = playlist.findIndex(song => song.id === currentId);
            if (index === -1) index = Math.min(currentFileIndex, Math.max(0, playlist.length - 1));
            currentFileIndex = index;
        }

        function connectDatabase() {
            if (typeof firebase === 'undefined') return;
            try {
                const app = firebase.initializeApp(FB_CONFIG);
                const fs = firebase.firestore(app);
                fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
                fs.collection(FB_COLLECTION).onSnapshot(snapshot => {
                    const fromServer = !(snapshot.metadata && snapshot.metadata.fromCache);
                    const initial = !dbSynced;
                    if (fromServer) dbSynced = true;
                    let changed = false;
                    let newestKey = null;
                    snapshot.docChanges().forEach(change => {
                        const doc = change.doc;
                        const key = doc.id;
                        if (change.type === 'removed') {
                            if (cloudSongs.delete(key)) changed = true;
                            return;
                        }
                        const data = doc.data();
                        const name = String(data.name || key);
                        const type = String(data.type || '').toLowerCase();
                        const isAudio = type === 'audio' || /\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(name);
                        const isMidi = type === 'midi' || type === 'mid' || /\.(mid|midi)$/i.test(name) || (!type && !isAudio);
                        let raw = typeof data.data === 'string' ? data.data : '';
                        raw = raw.replace(/^data:[^,]*,/, '');
                        if (/\s/.test(raw)) raw = raw.replace(/\s+/g, '');
                        if (!isMidi || isAudio || !raw) {
                            if (cloudSongs.delete(key)) changed = true;
                            return;
                        }
                        const addedAt = data.addedAt && data.addedAt.toMillis ? data.addedAt.toMillis() : 0;
                        cloudSongs.set(key, makeCloudSong(key, { name, data: raw }, addedAt));
                        changed = true;
                        if (!initial && change.type === 'added') newestKey = key;
                    });
                    if (changed) {
                        rebuildPlaylist();
                        if (newestKey) focusSong('c:' + newestKey, true);
                        updateUI();
                    }
                }, () => {});
            } catch (err) {}
        }

        connectDatabase();

        async function restoreState() {
            try {
                await openDb();
            } catch (e) {
                return;
            }

            const settings = await dbGet('kv', 'settings').catch(() => null);
            let savedTrackId = null;
            if (settings) {
                if (Number.isFinite(settings.tempo)) {
                    tempo = Math.min(300, Math.max(40, Math.round(settings.tempo / 5) * 5));
                }
                backgroundId = settings.backgroundId === undefined ? null : settings.backgroundId;
                savedTrackId = settings.trackId === undefined ? null : settings.trackId;
            }

            const hidden = await dbGet('kv', 'hiddenCloud').catch(() => null);
            if (hidden && Array.isArray(hidden.ids)) hidden.ids.forEach(id => hiddenCloud.add(id));

            const songs = await dbAll('songs').catch(() => []);
            songs.forEach(record => {
                try {
                    playlist.push({ id: record.id, name: record.name, midi: new Midi(record.data), size: record.data.byteLength });
                } catch (err) {
                    dbDelete('songs', record.id).catch(() => {});
                }
            });
            wantedTrackId = savedTrackId;
            rebuildPlaylist();

            if (backgroundId !== null) {
                const image = await dbGet('images', backgroundId).catch(() => null);
                if (image) applyBackground(image.blob);
                else backgroundId = null;
            }

            if (isPowerOn) Tone.Transport.bpm.value = tempo;
            updateUI();

            if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        }

        document.addEventListener('touchmove', (e) => {
            if (e.target.closest && e.target.closest('.history-panel')) return;
            if (e.cancelable) e.preventDefault();
        }, { passive: false });
        document.addEventListener('gesturestart', (e) => e.preventDefault());

        startRadioWatch();
        restoreState();
</script>
